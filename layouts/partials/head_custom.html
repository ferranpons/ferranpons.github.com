<!-- Fonts: Inter (text) + JetBrains Mono (labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- SEO keywords -->
<meta name="keywords" content="Kotlin Multiplatform, KMP, Android Engineer, iOS Engineer, Mobile Engineer, Kotlin Native, C++, CMake, AI Engineer, LLM, llama.cpp, on-device AI, Ferran Pons" />
<meta name="author" content="Ferran Pons" />

<!-- Twitter site handle -->
<meta name="twitter:site" content="@ponsaffair" />
<meta name="twitter:creator" content="@ponsaffair" />

<!-- Custom styles -->
<link rel="stylesheet" href="/css/custom.css">
<link rel="stylesheet" href="/css/refined.css">
<script src="/js/site.js" defer></script>

{{- if .IsHome }}
<script type="application/ld+json">{{ dict "@context" "https://schema.org" "@type" "SoftwareSourceCode" "name" "Llamatik" "description" "Open-source Kotlin Multiplatform SDK for running large language models (llama.cpp) on-device on Android, iOS and desktop." "codeRepository" "https://github.com/llamatik/Llamatik" "url" "https://www.llamatik.com/" "programmingLanguage" (slice "Kotlin" "C++") "runtimePlatform" (slice "Android" "iOS" "JVM") "author" (dict "@id" (printf "%s#person" .Site.Home.Permalink)) | jsonify | safeJS }}</script>
{{- end }}
